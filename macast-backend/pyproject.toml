[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macast-han-sidecar"
# version synced from tauri.conf.json
version = "2.0.1"
description = "HanCast Python Sidecar (fork of xfangfang/Macast)"
readme = "README.md"
license = "GPL-3.0"
requires-python = ">=3.11"
authors = [
    { name = "Han" },
]

dependencies = [
    "requests>=2.28.0",
    "lxml>=4.9.0",
    "netifaces>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "nuitka>=2.0",
    "ordered-set>=4.0",
    "zstandard>=0.22.0",
]

[project.scripts]
macast-sidecar = "macast_sidecar.main:main"

[tool.hatch.build.targets.wheel]
packages = ["macast_sidecar"]
