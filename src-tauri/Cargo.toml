[package]
name = "HanCast"
# version synced from tauri.conf.json
version = "2.1.0"
description = "HanCast: A cross-platform media casting application (fork of xfangfang/Macast)"
authors = ["lanzeweie@foxmail.com"]
edition = "2021"

[lib]
name = "hancast_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
mime_guess = "2"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
] }
